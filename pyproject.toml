[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secret-hitler-bot"
version = "0.1.0"
description = "Discord bot for the Secret Hitler board game"
requires-python = ">=3.8"
dependencies = [
    "discord.py>=2.3.2",
    "aiohttp>=3.9.4",
    "Pillow>=10.3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
dev = [
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
    "mypy>=1.10",
    # pull in test tools during development too
    "secret-hitler-bot[test]",
]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
